# Visual regression: compare screenshots to baselines on PRs
name: Visual regression

on:
  pull_request:
    branches: [main]
    paths:
      - '_config.yml'
      - '_layouts/**'
      - '_data/**'
      - '_posts/**'
      - 'assets/**'
      - 'index.md'
      - 'tests/visual/**'
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: |
          npx serve _site -p 4000 &
          sleep 5
          npx playwright test
        env:
          BASE_URL: http://127.0.0.1:4000/personal-page
